name: fitst_app
description: "تطبيق تواصل اجتماعي متكامل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  dio: ^5.4.3+1
  socket_io_client: ^3.0.2
  postgres: ^3.1.1

  image_picker: ^1.1.2
  file_picker: ^8.0.3
  camera: 0.11.0+2
  path_provider: ^2.1.3
  open_file: ^3.3.2
  open_file_plus: ^3.3.1

  flutter_sound: ^9.2.13
  just_audio: ^0.9.38
  video_player: ^2.8.6
  flutter_webrtc: ^0.11.4
  audioplayers: ^6.0.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  shared_preferences: ^2.2.3
  flutter_cache_manager: ^3.3.2
  cached_network_image: ^3.3.1

  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  intl: ^0.20.2
  flutter_contacts: ^1.1.8
  sdp_transform: ^0.3.2
  share_plus: ^10.0.0

  pdf: ^3.10.8
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3  # ✅ تمت الإضافة

flutter:
  uses-material-design: true
  assets:
    - assets/theams/lightmode.png
    - assets/theams/darkmode.png
    - assets/sounds/ringtone.mp3
    - assets/sounds/call_connected.mp3
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf

# ==================== تكوين أيقونة التطبيق ====================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/theams/chats.png"   # ✅ استخدم الصورة التي تريدها
  adaptive_icon_background: "#3B82F6"        # لون الخلفية (أزرق)
  adaptive_icon_foreground: "assets/theams/chats.png"

dependency_overrides:
  camera_android_camerax: 0.5.0